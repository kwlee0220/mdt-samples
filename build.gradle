plugins {
	id 'java'
	id("com.gradleup.shadow") version "9.3.0"
	id 'eclipse'
}

group = 'etri'
version = System.getenv("MDT_BUILD_VERSION") ?: "unknown"

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	lombok_version = '1.18.46'

	okhttp_version = '4.12.0'
	aas4j_version = '1.0.5'

	postgresql_version = '42.7.7'
}

dependencies {
	implementation project(":utils")
	implementation project(":mdt-client")
	
	implementation "org.eclipse.digitaltwin.aas4j:aas4j-model:${aas4j_version}"
	implementation "org.eclipse.digitaltwin.aas4j:aas4j-dataformat-aasx:${aas4j_version}"

	// Lombok (from the project :utils)
	compileOnly "org.projectlombok:lombok:${lombok_version}"
	annotationProcessor "org.projectlombok:lombok:${lombok_version}"
	
	runtimeOnly "org.postgresql:postgresql:${postgresql_version}"
	
	// HTTP Client
	implementation "com.squareup.okhttp3:okhttp:${okhttp_version}"
}

jar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	// 다른 프로젝트의 logback.xml만 제외하고, 자신의 것은 포함
	exclude 'logback-test.xml'
	exclude 'logback-spring.xml'
}

// 예제마다 main 메서드가 있으므로 대표 main 클래스를 두지 않는다. 실행:
//   gradle runSample -Psample=ListMDTInstances [--args='...']
tasks.register('runSample', JavaExec) {
	group = 'application'
	description = 'Runs a sample in mdt.sample (-Psample=<class name>)'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = providers.gradleProperty('sample').map { "mdt.sample.${it}" }
	standardInput = System.in
}

shadowJar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	mergeServiceFiles()
	
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
}

eclipse {
	classpath {
		file {
			whenMerged { cp ->
				def linkedProjectBuildLibDirs = [
					project(':utils').projectDir.toPath().resolve('build/libs').toUri().getPath().replaceAll('/+$', '')
				]
				cp.entries.removeAll { entry ->
					entry.kind == 'lib'
						&& entry.path != null
						&& linkedProjectBuildLibDirs.any { dir -> entry.path.startsWith(dir + '/') }
				}
				cp.entries.each { entry ->
					if (entry.kind == 'src' && entry.path == 'src/main/resources') {
						entry.excludes = []
					}
					if (entry.kind == 'src' && entry.path == 'src/test/resources') {
						entry.excludes = []
					}
				}
			}
		}
	}
}